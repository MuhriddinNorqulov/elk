name: filebeat

# =============================================================================
# Bu faylda muhitga bog'liq qiymat YO'Q — hammasi `.env` dan keladi.
# Boshqa serverga ko'chirish uchun faqat `.env` ni tahrirlang.
# =============================================================================

services:
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: filebeat
    user: root

    # -------------------------------------------------------------------------
    # `command` image'ning standart CMD'ini ALMASHTIRADI. Image'da u
    # ["-environment", "container"] bo'lgan. Faqat "--strict.perms=false"
    # qoldirilsa `docker logs filebeat` bo'sh ko'rinadi, shuning uchun
    # standart CMD'ni qaytaramiz.
    #
    # Stderr filebeat.yml dagi `logging.to_stderr: true` orqali yoqilgan.
    # Fayl loglari esa `logging.to_files: false` bilan o'chirilgan.
    # -------------------------------------------------------------------------
    command: [ "-environment", "container", "--strict.perms=false" ]

    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro

      # -----------------------------------------------------------------------
      # Registry: qaysi fayldan qayergacha o'qilgani.
      # Yo'qotsangiz butun tarix qaytadan yuboriladi. `fingerprint` tufayli
      # dublikat chiqmaydi, lekin ES'ga behuda yuk bo'ladi.
      # -----------------------------------------------------------------------
      - ./.volumes/filebeat-data:/usr/share/filebeat/data

      # -----------------------------------------------------------------------
      # Filebeat'ning O'Z loglari. Host'ga chiqarilgan, shuning uchun
      # `tail -f ./.volumes/filebeat-logs/filebeat-*.ndjson` ishlaydi va
      # konteyner qayta yaratilganda log yo'qolmaydi.
      #
      # Bu fayllar ELK'ga YUBORILMAYDI — yagona input faqat /logs/ ga qaraydi.
      # -----------------------------------------------------------------------
      - ./.volumes/filebeat-logs:/usr/share/filebeat/logs

      # -----------------------------------------------------------------------
      # LOG KATALOGI.
      #   chapda  — host'dagi yo'l (.env: LOG_DIR)
      #   o'ngda  — konteyner ichidagi yo'l; oxirgi bo'lak `service` maydoni
      #             bo'lib chiqadi (.env: SERVICE_NAME)
      #
      # Ichida async/ gateway/ http/ ws/ kataloglari kutiladi — ularning
      # nomi `log_type` bo'ladi. Yangi tur qo'shilsa konfigga tegish shart emas.
      #
      # IKKINCHI SERVIS: shunchaki yana bitta qator qo'shing, masalan
      #   - /var/log/id-ilmiy:/logs/id-ilmiy:ro
      # filebeat.yml ga TEGISH SHART EMAS — u /logs/ ostidagi hamma servisni
      # o'zi topadi.
      # -----------------------------------------------------------------------
      - ${LOG_DIR}:/logs/${SERVICE_NAME}:ro

    environment:
      - ELASTIC_HOSTS=${ELASTIC_HOSTS}
      - ELASTIC_API_KEY=${ELASTIC_API_KEY}
      - SERVER_NAME=${SERVER_NAME}
      - INPUT_ID=${INPUT_ID}
      - ES_INDEX=${ES_INDEX}
      - ES_DEAD_LETTER_INDEX=${ES_DEAD_LETTER_INDEX}
      - IGNORE_OLDER=${IGNORE_OLDER}
      - CLOSE_INACTIVE=${CLOSE_INACTIVE}
      - BULK_MAX_SIZE=${BULK_MAX_SIZE}
      - FILEBEAT_LOG_LEVEL=${FILEBEAT_LOG_LEVEL}

    mem_limit: ${FILEBEAT_MEM_LIMIT}
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Bu — Docker'ning log drayveri (Filebeat'ning `logging:` bloki EMAS).
    # Filebeat stdout ga yozgani uchun, cheklovsiz qoldirilsa diskni
    # asta-sekin to'ldiradi.
    # -------------------------------------------------------------------------
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
