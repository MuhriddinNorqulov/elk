# =============================================================================
# App serveridagi Filebeat
#
# Muhitga bog'liq qiymat bu faylda YO'Q — hammasi `.env` dan keladi.
#
# Konteyner ichidagi kutilayotgan tuzilma:
#   /logs/<servis>/<log_type>/<sana>.log
#   masalan  /logs/anticopy/http/2026-08-04.log
#
# Katalog nomlari maydonga aylanadi:  1-bo'lak -> service,  2-bo'lak -> log_type
#
# Shuning uchun na servis nomi, na log turi bu yerda sanalmaydi. Yangi log
# turi yoki yangi servis qo'shish uchun docker-compose.yml ga bitta mount
# qatori yetarli.
# =============================================================================


filebeat.inputs:

  - type: filestream

    # `id` — registry kaliti: "qaysi fayldan qayergacha o'qidim" holati shu
    # nom ostida saqlanadi. Hujjatlarga maydon bo'lib CHIQMAYDI.
    #
    # O'ZGARTIRMANG. O'zgarsa holat yo'qoladi va butun tarix ES'ga qaytadan
    # yuboriladi (`fingerprint` tufayli dublikat chiqmaydi, lekin behuda yuk).
    id: ${INPUT_ID}

    # /logs/ ostidagi hamma servis, hamma log turi.
    paths:
      - /logs/*/*/*.log

    prospector.scanner:
      # Ilova har bir katalogda joriy faylga `.log` simvolik havolasi yaratadi.
      # Kuzatilsa bugungi loglar ikki marta indekslanadi — ikkala sozlama ham
      # shuning uchun kerak.
      symlinks: false
      exclude_files: [ '/\.log$' ]

    parsers:
      - ndjson:
          target: ""                  # maydonlar top-level ga chiqadi
          overwrite_keys: true
          add_error_key: true         # parse buzilsa json_error paydo bo'ladi
          expand_keys: true

    processors:
      # zap ISO8601 yozadi: "2026-07-20T14:47:11.327+0500".
      # Layout mos kelmasa @timestamp "Filebeat o'qigan payt" bo'lib qoladi va
      # Kibana'dagi vaqt filtri butunlay noto'g'ri ishlaydi.
      - timestamp:
          field: ts
          layouts:
            - '2006-01-02T15:04:05.000Z0700'
            - '2006-01-02T15:04:05Z07:00'
          ignore_missing: true

      # Servis nomi konfigda qotirilmasligining sababi shu processor:
      #   /logs/anticopy/http/2026-08-04.log -> service=anticopy, log_type=http
      - dissect:
          tokenizer: "/logs/%{service}/%{log_type}/%{}.log"
          field: "log.file.path"
          target_prefix: ""
          ignore_failure: true

      # Sof nom konvensiyasi — tur o'zgarmaydi, shuning uchun xavfsiz.
      #
      # `error` va `status` ga TEGILMAYDI va bu yerga qo'shilmasin ham:
      # ikkalasi ham oddiy matn/son bo'lib kelishi kerak. `error` ni
      # `error.message` ga ko'chirish uni OBYEKTGA aylantiradi va ES uni
      # to'qnashuv deb rad etadi (400, qayta urinilmaydi, qator yo'qoladi).
      - rename:
          fields:
            - from: "msg"
              to: "message"
            - from: "level"
              to: "log.level"
            - from: "caller"
              to: "log.origin.file.name"
          ignore_missing: true
          fail_on_error: false

      # `ts` dan @timestamp olindi, asl maydon keraksiz.
      - drop_fields:
          fields: [ "ts" ]
          ignore_missing: true

      # Hujjat _id si fayl yo'li + qatorning fayldagi o'rnidan hosil bo'ladi.
      # Ayni qator qayta o'qilsa _id bir xil chiqadi va ES uni yangisi
      # sifatida emas, ustiga yozadi — registry yo'qolsa ham dublikat yo'q.
      #
      # SHU YERDA turishi shart: `log.offset` fayl oxiridagi global
      # `drop_fields` bilan o'chiriladi.
      - fingerprint:
          fields: [ "log.file.path", "log.offset" ]
          target_field: "@metadata._id"

    ignore_older: ${IGNORE_OLDER}     # 0 = butun tarix
    clean_inactive: 0                 # ignore_older dan KATTA yoki 0

    # Fayl shuncha vaqt o'zgarmasa harvester yopiladi. Kunlik fayllar
    # to'planganda bu yuzlab file descriptor tejaydi.
    close.on_state_change.inactive: ${CLOSE_INACTIVE}


processors:
  - add_host_metadata: ~

  - add_fields:
      target: ""
      fields:
        server: ${SERVER_NAME}

  # DIQQAT: `log.offset` shu yerda o'chadi — yuqoridagi `fingerprint` undan
  # oldin ishlashi shart.
  - drop_fields:
      fields: [ "agent.ephemeral_id", "ecs.version", "input.type", "log.offset" ]
      ignore_missing: true


# =============================================================================
# Bu agent indeks shabloni / ILM / dashboard YARATMAYDI — cheklangan API key
# bilan qila olmaydi va ishga tushmay xato beradi.
#
# Klasterda `filebeat-*` uchun shablon yo'q, ya'ni hamma maydon DINAMIK
# mapping bilan ketadi: turini birinchi hujjat belgilaydi va keyin uni
# o'zgartirib bo'lmaydi. Shuning uchun loglarning tur barqarorligi ILOVA
# tomonida ta'minlanadi, bu yerda emas.
# =============================================================================
# ILM yoqilsa Filebeat o'zi rollover indekslarini boshqaradi VA yuqoridagi
# `index:` sozlamasini JIMGINA e'tiborsiz qoldiradi ("Custom index settings
# are ignored when ILM is enabled"). Ya'ni yoqsangiz indeks nomingiz yo'qoladi.
# Bundan tashqari `manage_ilm` huquqi kerak — API keyda u yo'q.
setup.ilm.enabled: false

# Filebeat'ning standart ECS shabloni (minglab maydon) yuklanmasin.
# `manage_index_templates` huquqi kerak — API keyda u yo'q, yuklashga
# urinsa ishga tushmay xato beradi.
setup.template.enabled: false

# Kibana dashboard'lari yuklanmasin. Bu ALLAQACHON standart holat —
# hujjat: "Dashboard loading is disabled by default" va u faqat shu sozlama
# yoqilganda yoki `filebeat setup` buyrug'i bilan ishga tushadi.
# Aniqlik uchun ochiq yozilgan.
setup.dashboards.enabled: false

# Bu ikkovi shablon YARATILGANDA ishlatilardi: `name` — shablonning ES'dagi
# nomi, `pattern` — u qaysi indekslarga tegishli ekani (index_patterns).
#
# `setup.template.enabled: false` bo'lgani uchun ular hozir HECH NARSA
# QILMAYDI. Tekshirilgan: ikkovi olib tashlansa ham, qiymat bema'ni bo'lsa ham
# `filebeat test config` -> Config OK.
#
# Baribir qoldirilgan: hujjat "`index` ni o'zgartirsangiz shu ikkovi ham
# kerak" deydi, `test config` esa buni tekshirmaydi. Ishga tushishda kutilmagan
# xato bo'lgandan ko'ra ikkita qator turgani arzon.
#
# Nomi shu o'rnatmaning indeksidan olinadi. Kimdir kelajakda shablonni yoqsa,
# u FAQAT shu serverning indekslariga tegadi — `filebeat-*` deb qoldirilsa
# klasterdagi boshqa agentlarning indekslarini ham qamrab olardi.
# `${ES_INDEX}*` ikkalasini oladi: asosiy indeks va uning dead-letter'i.
setup.template.name: "${ES_INDEX}"
setup.template.pattern: "${ES_INDEX}*"


output.elasticsearch:
  hosts: [ "${ELASTIC_HOSTS}" ]
  # XOM format: <id>:<api_key>. Kibana bergan Base64 ("Encoded") EMAS.
  #
  # Filebeat qiymatni O'ZI base64 qiladi (8.15.3 manbasi, eslegclient:
  #   conn.apiKeyAuthHeader = "ApiKey " + base64.StdEncoding.EncodeToString(...)
  # maydon izohi: "Raw API key, NOT base64-encoded"). Encoded qiymat qo'yilsa
  # ikki marta kodlanadi; ES bir marta dekod qiladi, ichida `:` topolmaydi va
  # 401 "invalid ApiKey value" beradi.
  #
  # TUZOQ: curl bilan tekshirish chalg'itadi —
  #   curl -H "Authorization: ApiKey <encoded>" .../_security/_authenticate
  # muvaffaqiyat qaytaradi, chunki HTTP SARLAVHASI encoded qiymat kutadi.
  # Konfig esa xom qiymat kutadi. Ikkisi bir xil emas. Filebeat qanday
  # yuborsa, shunday tekshiring:
  #   curl -H "Authorization: ApiKey $(printf %s "$KEY" | base64 -w0)" ...
  api_key: "${ELASTIC_API_KEY}"
  bulk_max_size: ${BULK_MAX_SIZE}
  backoff.init: 1s
  backoff.max: 60s

  # ---------------------------------------------------------------------------
  # `filebeat-` PREFIKSI MAJBURIY — quyidagi ikkala nom uchun ham.
  # API key aynan `filebeat-*` va `.ds-filebeat-*` ga `create_doc` +
  # `auto_configure` beradi; boshqa prefiks -> har bir hujjat 403 -> hech
  # narsa kelmaydi.
  #
  # Nomda sana yo'q: eski loglarni o'chirish uchun `delete_by_query` kerak
  # bo'ladi (sekin, joyni darrov bo'shatmaydi). ILM ham o'chiq. Hajm o'ssa
  # qayta ko'rib chiqiladi.
  # ---------------------------------------------------------------------------
  index: "${ES_INDEX}"

  # ---------------------------------------------------------------------------
  # ES rad etgan hujjat (mapping to'qnashuvi va h.k.) TASHLANMAYDI, keyingi
  # partiyada shu indeksga qayta yuboriladi:
  #     message       -> asl voqeaning to'liq JSON'i, MATN sifatida
  #     error.type    -> status kodi
  #     error.message -> ES qaytargan sabab
  #
  # `message` matn bo'lgani uchun uni rad etgan to'qnashuv bu yerda
  # takrorlanmaydi. Elastic bu imkoniyatni beta deb belgilagan.
  #
  # QAMROVI: faqat ES RAD ETGAN hujjatlar. ES o'chgani, kalit eskirgani,
  # Filebeat o'lgani yoki fayl o'qishdagi ruxsat xatosi bu yerga TUSHMAYDI —
  # ular uchun Kibana'da "oxirgi 15 daqiqada 0 hujjat" ogohlantirishi kerak.
  # ---------------------------------------------------------------------------
  non_indexable_policy.dead_letter_index:
    index: "${ES_DEAD_LETTER_INDEX}"


# =============================================================================
# Filebeat'ning O'Z loglari IKKALA joyga yoziladi:
#   to_stderr -> `docker logs filebeat`
#   to_files  -> /usr/share/filebeat/logs/  (host'da ./.volumes/filebeat-logs)
#
# Ular ELK'ga YUBORILMAYDI — bu fayllarni o'qiydigan input yo'q, yagona input
# faqat /logs/ ostiga qaraydi.
#
# Fayl host'ga mount qilingan, ya'ni `tail -f` va `grep` to'g'ridan-to'g'ri
# ishlaydi va konteyner qayta yaratilganda log yo'qolmaydi.
#
# rotateeverybytes/keepfiles — disk cheklovi: 3 x 10 MB dan oshmaydi.
# =============================================================================
logging.level: ${FILEBEAT_LOG_LEVEL}
logging.to_stderr: true
logging.to_files: true
logging.files:
  path: /usr/share/filebeat/logs
  name: filebeat
  rotateeverybytes: 10485760      # 10 MB
  keepfiles: 3
  permissions: 0644
logging.metrics.enabled: false
