# =============================================================================
# App serveridagi Filebeat
#
# Kutilayotgan tuzilma. Chapda host'dagi haqiqiy yo'l, o'ngda konteyner
# ichidagi ko'rinishi (docker-compose.yml dagi mount):
#   /home/devops/anticopy-backend/logs/async/2026-07-25.log
#                                 -> /logs/anticopy/async/2026-07-25.log
#   ...gateway/ , http/ , ws/ — xuddi shunday
#
# Katalog nomi = log_type. Yangi tur qo'shilsa konfigga tegish SHART EMAS.
# Yangi kunlik fayl ham avtomatik topiladi.
# =============================================================================



filebeat.inputs:

  - type: filestream
    id: anticopy-dev                        # <-- SERVIS NOMI (unikal bo'lsin)
    paths:
      - /logs/anticopy/*/*.log

    prospector.scanner:
      # Har bir katalogdagi `.log` — joriy faylga simvolik havola.
      # Kuzatilsa bugungi loglar IKKI MARTA indekslanadi.
      symlinks: false
      exclude_files: [ '/\.log$' ]

    parsers:
      - ndjson:
          target: ""                  # maydonlar top-level ga chiqadi
          overwrite_keys: true
          add_error_key: true         # parse buzilsa json_error paydo bo'ladi
          expand_keys: true

    processors:
      # ---- zap ISO8601 yozadi: "2026-07-20T14:47:11.327+0500" ----
      # 'UNIX' (epoch float) EMAS — u bilan parse doim fail bo'lib,
      # @timestamp = "Filebeat o'qigan payt" bo'lib qolardi.
      - timestamp:
          field: ts
          layouts:
            - '2006-01-02T15:04:05.000Z0700'
            - '2006-01-02T15:04:05Z07:00'
          ignore_missing: true

      # Yo'ldan service va log_type ni ajratadi:
      #   /logs/plagix/http/2026-07-25.log -> service=plagix, log_type=http
      - dissect:
          tokenizer: "/logs/%{service}/%{log_type}/%{}.log"
          field: "log.file.path"
          target_prefix: ""
          ignore_failure: true

      # -----------------------------------------------------------------------
      # Bu yerda `error` ga TEGILMAYDI — ataylab.
      #
      # Ilgari `error` -> `error.message` ko'chirish bor edi, izohida esa
      # "async obyekt yozadi" deyilgan edi. Bu XATO edi: kodda bironta
      # MarshalLogObject yo'q va hamma joyda zap.Error() ishlatiladi — u DOIM
      # matn yozadi. Obyektni aynan o'sha rename yasagan, ES'da `error` esa
      # `text` bo'lgan -> har bir voqea 400 bilan rad etilgan.
      #
      # `stacktrace` -> `error.stack_trace` ham olib tashlandi. Birinchidan,
      # ilova `stacktrace` degan maydonni umuman yozmaydi (u `stack` deb
      # ataladi), ya'ni qoida hech qachon ishlamagan. Ikkinchidan, agar uni
      # `stack` ga to'g'rilaganimizda `error` yana OBYEKT bo'lib qolardi va
      # yuqoridagi to'qnashuv qaytardi.
      #
      # Natija: `error` va `stack` — ikkita oddiy matn maydoni. Bitta tur,
      # to'qnashuv manbasi yo'q.
      # -----------------------------------------------------------------------
      - rename:
          fields:
            - from: "msg"
              to: "message"
            - from: "level"
              to: "log.level"
            - from: "caller"
              to: "log.origin.file.name"
          ignore_missing: true
          fail_on_error: false

      - drop_fields:
          fields: [ "ts" ]
          ignore_missing: true

      # -----------------------------------------------------------------------
      # DUBLIKATGA QARSHI HIMOYA
      #
      # Hujjat _id si fayl yo'li + qatorning fayldagi o'rnidan hosil qilinadi.
      # Ayni qator qayta o'qilsa _id bir xil chiqadi va Elasticsearch uni
      # YANGISI sifatida emas, USTIGA yozadi.
      #
      # Natija: registry yo'qolsa ham (yoki qo'lda o'chirilsa ham) dublikat
      # paydo bo'lmaydi — eng ko'pi bilan o'sha hujjat qayta yoziladi.
      #
      # MUHIM: `log.offset` fayl oxirida global `drop_fields` bilan
      # o'chiriladi, shuning uchun bu processor SHU YERDA — input ichida —
      # turishi shart.
      # -----------------------------------------------------------------------
      - fingerprint:
          fields: [ "log.file.path", "log.offset" ]
          target_field: "@metadata._id"

    # 0 = butun tarix. Birinchi sinovda 168h qo'yib, @timestamp to'g'riligini
    # tasdiqlagach 0 ga o'tkazing.
    ignore_older: 0
    clean_inactive: 0                 # ignore_older dan KATTA yoki 0

    # Kun tugagach fayl o'zgarmaydi — harvester yopiladi, fd tejaladi.
    # Bir yillik arxivda bu yuzlab file descriptor demakdir.
    close.on_state_change.inactive: 30m

  # ---------------------------------------------------------------------------
  # Ikkinchi servis — nusxa olib, id / paths ni o'zgartiring.
  # docker-compose.yml ga mos mount qo'shishni unutmang.
  # ---------------------------------------------------------------------------
  # - type: filestream
  #   id: id-ilmiy
  #   paths:
  #     - /logs/id-ilmiy/*/*.log
  #   prospector.scanner:
  #     symlinks: false
  #     exclude_files: ['/\.log$']
  #   parsers:
  #     - ndjson:
  #         target: ""
  #         overwrite_keys: true
  #         add_error_key: true
  #         expand_keys: true
  #   processors:
  #     - timestamp:
  #         field: ts
  #         layouts:
  #           - '2006-01-02T15:04:05.000Z0700'
  #           - '2006-01-02T15:04:05Z07:00'
  #         ignore_missing: true
  #     - dissect:
  #         tokenizer: "/logs/%{service}/%{log_type}/%{}.log"
  #         field: "log.file.path"
  #         target_prefix: ""
  #         ignore_failure: true
  #     - rename:
  #         fields:
  #           - from: "msg"
  #             to: "message"
  #           - from: "level"
  #             to: "log.level"
  #         ignore_missing: true
  #         fail_on_error: false
  #     - drop_fields:
  #         fields: ["ts"]
  #         ignore_missing: true
  #   ignore_older: 0
  #   clean_inactive: 0
  #   close.on_state_change.inactive: 30m


processors:
  - add_host_metadata: ~

  # Bir nechta app server bo'lganda ajratish uchun
  - add_fields:
      target: ""
      fields:
        server: ${SERVER_NAME}

  - drop_fields:
      fields: [ "agent.ephemeral_id", "ecs.version", "input.type", "log.offset" ]
      ignore_missing: true


# =============================================================================
# Bu agent indeks shabloni / ILM / dashboard yaratishga URINMAYDI — cheklangan
# API key bilan qila olmaydi va ishga tushmay xato berardi.
#
# TEKSHIRILGAN HOLAT (2026-08-04): klasterda `filebeat-*` uchun umuman shablon
# YO'Q (`GET _index_template?name=filebeat*` -> bo'sh). Ilgari bu yerda
# "markaziy Filebeat yaratgan" deb yozilgan edi — u yaratmagan. Ya'ni hozir
# hamma maydon DINAMIK mapping bilan ketadi va turini birinchi hujjat
# belgilaydi. Shuning uchun loglarning tur barqarorligi ilova tomonida
# ta'minlanadi.
# =============================================================================
setup.ilm.enabled: false
setup.template.enabled: false
setup.kibana.enabled: false


output.elasticsearch:
  hosts: [ "${ELASTIC_HOSTS}" ]
  # XOM format: <id>:<api_key>. Kibana bergan Base64 ("Encoded") EMAS.
  api_key: "${ELASTIC_API_KEY}"
  bulk_max_size: 50
  backoff.init: 1s
  backoff.max: 60s

  # ---------------------------------------------------------------------------
  # RAD ETILGAN HUJJATLAR (mapping to'qnashuvi va h.k.)
  #
  # Standart siyosat — `drop`: ES 400 qaytarsa voqea JIMGINA yo'qoladi va
  # buni faqat hisoblagichdan bilish mumkin. Bu yerda esa voqea keyingi
  # partiyada boshqa indeksga qayta yuboriladi:
  #     message       -> asl voqeaning to'liq JSON'i, MATN sifatida
  #     error.type    -> status kodi
  #     error.message -> ES qaytargan sabab
  #
  # `message` matn bo'lgani uchun uni rad etgan mapping to'qnashuvi bu yerda
  # takrorlanmaydi.
  #
  # Nom `filebeat-` bilan boshlanishi SHART: API key aynan `filebeat-*` ga
  # `create_doc` + `auto_configure` beradi. Boshqa nom -> 403 -> yana jimlik.
  #
  # DIQQAT: Elastic buni beta deb belgilagan.
  # ---------------------------------------------------------------------------
  non_indexable_policy.dead_letter_index:
    index: "filebeat-dead-letter"

# =============================================================================
# Filebeat'ning O'Z loglari — faqat stderr, ya'ni `docker logs filebeat`.
#
# Fayl loglari (`to_files`) ATAYLAB O'CHIRILGAN: ular faqat o'sha loglarni
# qayta o'qib ELK'ga yuboradigan inputlar uchun kerak edi, endi ular yo'q.
# Yoqib qo'yilsa konteyner ichida hech kim o'qimaydigan fayllar to'planadi.
#
# Rad etilgan hujjatlar endi yuqoridagi `filebeat-dead-letter` indeksida.
# =============================================================================
logging.level: info
logging.to_stderr: true
logging.to_files: false
logging.metrics.enabled: false
