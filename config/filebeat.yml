# =============================================================================
# Filebeat — Docker konteyner loglarini yig'ish
# =============================================================================

filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      # MUHIM: false bo'lsa faqat `co.elastic.logs/enabled: "true"` labeli
      # qo'yilgan konteynerlar yig'iladi.
      #
      # true qilsangiz Filebeat es01, kibana va o'zining loglarini ham
      # indekslay boshlaydi — rekursiv shovqin, disk tez to'ladi.
      hints.default_config.enabled: false

processors:
  - add_docker_metadata: ~
  - add_host_metadata: ~
  - drop_fields:
      fields: ["agent.ephemeral_id", "ecs.version", "input.type", "log.offset"]
      ignore_missing: true

setup.kibana:
  host: ${KIBANA_HOSTS}
  username: ${ELASTIC_USER}
  password: ${ELASTIC_PASSWORD}

setup.ilm.enabled: true

output.elasticsearch:
  hosts: ["${ELASTIC_HOSTS}"]
  username: ${ELASTIC_USER}
  password: ${ELASTIC_PASSWORD}
  bulk_max_size: 50
  backoff.init: 1s
  backoff.max: 60s

logging.level: info
logging.metrics.enabled: false