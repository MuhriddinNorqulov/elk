name: elk

networks:
  elk:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Elasticsearch — single node, security YOQILGAN, TLS yo'q.
  # Port faqat 127.0.0.1 da: Kibana va Beat'lar docker network orqali kiradi,
  # tashqi kirish kerak emas.
  # ---------------------------------------------------------------------------
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es01
    volumes:
      - ${ELK_DATA_ROOT}/esdata:/usr/share/elasticsearch/data
      - ${ELK_DATA_ROOT}/snapshots:/usr/share/elasticsearch/snapshots
    ports:
      - "${ES_BIND_IP}:9200:9200"
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      # Autentifikatsiya yoqilgan, lekin TLS'siz — ichki tarmoq uchun oraliq bosqich.
      # single-node rejimida transport TLS majburiy emas, shuning uchun
      # sertifikat zanjiri kerak bo'lmaydi.
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - path.repo=/usr/share/elasticsearch/snapshots
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}
      - bootstrap.memory_lock=true
      - ingest.geoip.downloader.enabled=false
    mem_limit: ${ES_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # 401 javobi ES tayyor ekanini bildiradi — parolni healthcheck'ga
      # yozib qo'ymaslik uchun shu usul ishlatiladi.
      test:
        - CMD-SHELL
        - curl -s http://localhost:9200 | grep -q 'missing authentication credentials'
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks: [elk]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kibana — ichki tarmoqqa ochiq (192.168.x.x), login talab qiladi
  # ---------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    depends_on:
      es01:
        condition: service_healthy
    volumes:
      - ${ELK_DATA_ROOT}/kibanadata:/usr/share/kibana/data
    ports:
      # 0.0.0.0 EMAS — aniq IP. Serverda boshqa (tashqi) interfeys bo'lsa,
      # Kibana o'sha yerda ko'rinmaydi.
      - "${KIBANA_BIND_IP}:5601:5601"
    environment:
      - SERVERNAME=kibana
      - SERVER_PUBLICBASEURL=http://${KIBANA_BIND_IP}:5601
      - ELASTICSEARCH_HOSTS=http://es01:9200
      # kibana_system — superuser emas, faqat Kibana'ning tizim vazifalari uchun
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${ENCRYPTION_KEY}
      - MONITORING_UI_CONTAINER_ELASTICSEARCH_ENABLED=true
      - I18N_LOCALE=en
    mem_limit: ${KB_MEM_LIMIT}
    healthcheck:
      # security yoqilganda / manzili /login ga 302 qiladi
      test:
        - CMD-SHELL
        - curl -s -I http://localhost:5601 | grep -q '302 Found'
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    networks: [elk]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Filebeat — shu xostdagi, label qo'yilgan konteynerlarning loglari
  # ---------------------------------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION}
    container_name: filebeat
    depends_on:
      es01:
        condition: service_healthy
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # registry — qaysi fayldan qayergacha o'qilgani. YO'QOTMANG,
      # aks holda barcha loglar qaytadan indekslanadi.
      - ${ELK_DATA_ROOT}/filebeatdata:/usr/share/filebeat/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ELASTIC_HOSTS=http://es01:9200
      - KIBANA_HOSTS=http://kibana:5601
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    mem_limit: ${FB_MEM_LIMIT}
    networks: [elk]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Metricbeat — Stack Monitoring + docker/system metrikalari
  # Kerak bo'lmasa izohga oling, ~400 MB RAM tejaysiz.
  # ---------------------------------------------------------------------------
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:${STACK_VERSION}
    container_name: metricbeat
    depends_on:
      es01:
        condition: service_healthy
      kibana:
        condition: service_healthy
    user: root
    command: ["--strict.perms=false", "-system.hostfs=/hostfs"]
    volumes:
      - ./config/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - ${ELK_DATA_ROOT}/metricbeatdata:/usr/share/metricbeat/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    environment:
      - ELASTIC_HOSTS=http://es01:9200
      - KIBANA_HOSTS=http://kibana:5601
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    mem_limit: ${MB_MEM_LIMIT}
    networks: [elk]
    restart: unless-stopped